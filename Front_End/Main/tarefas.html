<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Resource/folha.css">
    <title>Minhas Tarefas</title>
</head>
<body>

<nav class="navbar">
    <div class="logo">MiniProjeto</div>
    <div class="links">
        <a href="tarefas.html" class="active">Tarefas</a>
        <a href="perfil.html">Perfil</a>
        <button onclick="logout()" class="btn-logout">Sair</button>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h2>Minhas Tarefas</h2>
        <p class="subtitle">Gerencie suas tarefas facilmente</p>
    </div>

    <form id="tarefaForm" class="card task-form">
        <input type="text" id="titulo" placeholder="Título da tarefa" required>
        <select id="prioridade">
            <option value="BAIXA">Baixa</option>
            <option value="MEDIA">Média</option>
            <option value="ALTA">Alta</option>
        </select>
        <button type="submit" class="btn-primary">Adicionar</button>
    </form>

    <ul id="listaTarefas" class="task-list"></ul>
</div>

<script src="/Resource/script.js"></script>

</body>
</html>
