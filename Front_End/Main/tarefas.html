<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Resource/folha.css">
    <title>Minhas Tarefas</title>
</head>
<body>

<nav class="navbar">
    <div class="logo">MiniProjeto</div>
    <div class="links">
        <a href="tarefas.html" class="active">Tarefas</a>
        <a href="perfil.html">Perfil</a>
        <button onclick="logout()" class="btn-logout">Sair</button>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h2>Minhas Tarefas</h2>
        <p class="subtitle">Gerencie suas tarefas facilmente</p>
    </div>

    <form id="tarefaForm" class="card task-form">
        <input type="text" id="titulo" placeholder="Título da tarefa" required>
        <select id="prioridade">
            <option value="BAIXA">Baixa</option>
            <option value="MEDIA">Média</option>
            <option value="ALTA">Alta</option>
        </select>
        <button type="submit" class="btn-primary">Adicionar</button>
    </form>

    <ul id="listaTarefas" class="task-list"></ul>
</div>

<script src="/Resource/script.js"></script>
<script>
const usuario = JSON.parse(sessionStorage.getItem("usuario"));

if (!usuario) window.location.href = "login.html";

function logout() {
    sessionStorage.clear();
    window.location.href = "login.html";
}

async function carregarTarefas() {
    if (!usuario) return;

    const res = await fetch(`http://localhost:8081/tarefas/usuario/${usuario.id}`);
    const data = await res.json();
    const tarefas = Array.isArray(data) ? data : data.content || [];

    const lista = document.getElementById("listaTarefas");
    lista.innerHTML = "";

    tarefas.forEach(t => {
        const li = document.createElement("li");

        li.innerHTML = `
            <span>${t.titulo} <span class="badge ${t.prioridade}">${t.prioridade}</span> - ${t.status}</span>
            <div>
                <button onclick="concluir(${t.id})">✔</button>
                <button onclick="excluir(${t.id})">❌</button>
            </div>
        `;
        lista.appendChild(li);
    });
}

async function concluir(id) {
    await fetch(`http://localhost:8081/tarefas/${id}/concluir`, { method: "PUT" });
    carregarTarefas();
}

async function excluir(id) {
    await fetch(`http://localhost:8081/tarefas/${id}`, { method: "DELETE" });
    carregarTarefas();
}

document.getElementById("tarefaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const tarefa = {
        titulo: document.getElementById("titulo").value,
        prioridade: document.getElementById("prioridade").value
    };

    await fetch(`http://localhost:8081/tarefas/usuario/${usuario.id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(tarefa)
    });

    carregarTarefas();
    document.getElementById("tarefaForm").reset();
});

window.addEventListener("load", carregarTarefas);
</script>

</body>
</html>
