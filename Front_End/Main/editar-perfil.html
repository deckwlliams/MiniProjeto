<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        small {
            color: #777;
            font-size: 12px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-salvar {
            background-color: #4CAF50;
            color: white;
        }

        .btn-cancelar {
            background-color: #ccc;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Editar Perfil</h1>
    <p class="subtitle">Atualize suas informações pessoais</p>

    <form>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" readonly>
        <small>O email não pode ser alterado</small>

        <label for="senha">Nova senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite uma nova senha">
        <small>Preencha apenas se quiser alterar a senha</small>

        <label for="confirmarSenha">Confirmar nova senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme a nova senha">

        <div class="buttons">
            <button type="button" class="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn-salvar">Salvar alterações</button>
        </div>

    </form>
</div>

</body>
</html>
