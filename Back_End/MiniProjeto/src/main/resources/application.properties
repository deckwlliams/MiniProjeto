# ==============================
# ? NOME DA APLICAÇÃO
# ==============================

# Define o nome da aplicação Spring Boot
# Esse nome aparece em logs e ferramentas de monitoramento
spring.application.name=MiniProjeto


# ==============================
# ? CONFIGURAÇÃO DO BANCO DE DADOS
# ==============================

# URL de conexão com o banco MySQL
# 127.0.0.1 = localhost (seu próprio computador)
# 3306 = porta padrão do MySQL
# db_estudo = nome do banco de dados
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_estudo?useTimezone=true&serverTimezone=UTC

# Usuário do banco de dados
spring.datasource.username=root

# Senha do banco de dados
spring.datasource.password=@Derick06

# Driver que permite o Java conversar com o MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==============================
# ? CONFIGURAÇÃO DO JPA / HIBERNATE
# ==============================

# Diz ao Hibernate o que fazer com as tabelas
# update = cria ou atualiza as tabelas automaticamente
# (NÃO apaga dados existentes)
spring.jpa.hibernate.ddl-auto=update

# Mostra no console os comandos SQL que o Spring executa
# Muito útil para aprendizado e debug
spring.jpa.show-sql=true

# Define o "dialeto" do banco (como o Hibernate fala com o MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ==============================
# ? CONFIGURAÇÃO DO SERVIDOR
# ==============================

# Define a porta onde a aplicação vai rodar
# Ex: http://localhost:8081
server.port=8081
